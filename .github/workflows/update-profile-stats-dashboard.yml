name: Update Profile Stats Dashboard

on:
  schedule:
    # Runs automatically every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Script Pipeline
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_dashboard.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "🤖 Auto-updated repository statistics [skip ci]"
          git push
